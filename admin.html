<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>復興國小 360° 平面圖定位管理後台 (Visual Plan CMS)</title>
  <link rel="icon" href="./assets/plans/1f.jpg" type="image/jpeg">
  <style>
    :root {
      --bg-dark: #0a0f0d;
      --bg-panel: #121a16;
      --bg-card: #18241f;
      --bg-card-hover: #1f302a;
      --border: rgba(255, 255, 255, 0.12);
      --accent: #10b981;
      --accent-hover: #059669;
      --accent-glow: rgba(16, 185, 129, 0.35);
      --gold: #facc15;
      --gold-glow: rgba(250, 204, 21, 0.4);
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --text: #f0fdf4;
      --text-muted: #94a3b8;
      --header-h: 54px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg-dark);
      color: var(--text);
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    /* Top Navigation Header */
    .admin-header {
      height: var(--header-h);
      background: #101714;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      gap: 12px;
      flex-shrink: 0;
      z-index: 100;
    }
    .admin-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .admin-badge {
      background: linear-gradient(135deg, #10b981, #047857);
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
      letter-spacing: 0.05em;
    }
    .admin-brand h1 {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .stat-chip {
      font-size: 12px;
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--border);
      padding: 3px 10px;
      border-radius: 20px;
      color: #a7f3d0;
      font-weight: 600;
    }
    .admin-tools {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 12px;
      font-size: 12.5px;
      font-weight: 600;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      cursor: pointer;
      transition: all 0.16s ease;
      white-space: nowrap;
      text-decoration: none;
    }
    .btn:hover {
      background: rgba(255, 255, 255, 0.16);
      border-color: rgba(255, 255, 255, 0.25);
    }
    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .btn-primary:hover {
      background: var(--accent-hover);
      box-shadow: 0 0 12px var(--accent-glow);
    }
    .btn-danger {
      background: rgba(239, 68, 68, 0.2);
      border-color: rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }
    .btn-danger:hover {
      background: var(--danger);
      color: #fff;
    }

    /* Main Workspace Layout (70% Map Stage : 30% Sidebar) */
    .admin-main {
      flex: 1;
      display: flex;
      overflow: hidden;
      position: relative;
    }

    /* Map Stage (70%) */
    .plan-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #060908;
      position: relative;
      overflow: hidden;
    }

    /* Map Stage Toolbar */
    .plan-toolbar {
      height: 48px;
      background: #111a17;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      gap: 12px;
      z-index: 10;
      flex-shrink: 0;
    }
    .floor-tabs {
      display: flex;
      gap: 5px;
    }
    .floor-btn {
      padding: 5px 12px;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .floor-btn:hover { color: #fff; background: rgba(255,255,255,0.12); }
    .floor-btn.is-active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      box-shadow: 0 0 8px var(--accent-glow);
    }
    .zoom-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .zoom-btn {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .zoom-btn:hover { background: rgba(255,255,255,0.18); }
    .zoom-label {
      font-size: 11.5px;
      font-weight: 700;
      color: #a7f3d0;
      min-width: 44px;
      text-align: center;
    }
    .stage-tip {
      font-size: 12px;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Map Viewport Area */
    .plan-viewport {
      flex: 1;
      position: relative;
      overflow: hidden;
      cursor: grab;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #111a16 0%, #060908 100%);
    }
    .plan-viewport:active {
      cursor: grabbing;
    }

    /* Transform Layer for Pan & Zoom */
    .plan-transform-layer {
      position: absolute;
      transform-origin: 0 0;
      will-change: transform;
      user-select: none;
    }
    .plan-img {
      display: block;
      width: 1024px;
      height: 746px;
      object-fit: contain;
      pointer-events: auto;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      border-radius: 4px;
    }

    /* Pins Layer */
    .pins-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    /* Interactive Spot Pin Marker */
    .spot-pin {
      position: absolute;
      pointer-events: auto;
      cursor: move;
      transform: translate(-50%, -50%);
      transition: transform 0.12s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.15s ease;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .spot-pin:hover {
      z-index: 20;
      transform: translate(-50%, -50%) scale(1.2);
    }
    .spot-pin.is-active {
      z-index: 30;
      transform: translate(-50%, -50%) scale(1.35);
    }
    .pin-badge {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #10b981;
      border: 2px solid #fff;
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.6);
      transition: all 0.15s ease;
    }
    .spot-pin.is-active .pin-badge {
      background: #facc15;
      border-color: #000;
      color: #000;
      box-shadow: 0 0 16px #facc15;
    }
    .pin-label {
      margin-top: 4px;
      background: rgba(15, 23, 21, 0.88);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 10px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      pointer-events: none;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
    }
    .spot-pin.is-active .pin-label {
      background: #facc15;
      color: #000;
      border-color: #facc15;
    }

    /* Floating HUD at bottom left */
    .stage-hud {
      position: absolute;
      bottom: 16px;
      left: 16px;
      z-index: 20;
      background: rgba(15, 23, 21, 0.9);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      gap: 4px;
      pointer-events: none;
      box-shadow: 0 6px 20px rgba(0,0,0,0.5);
    }
    .hud-title {
      font-size: 12.5px;
      font-weight: 700;
      color: #6ee7b7;
    }
    .hud-coords {
      font-size: 11.5px;
      font-family: monospace;
      color: var(--gold);
    }

    /* Right Sidebar (30%) */
    .admin-sidebar {
      width: 380px;
      max-width: 35vw;
      background: var(--bg-panel);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow: hidden;
      z-index: 20;
    }

    /* Search & Filter Header */
    .sidebar-header {
      padding: 10px 14px;
      background: #111a17;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .search-input {
      width: 100%;
      background: rgba(0,0,0,0.4);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px 10px;
      color: #fff;
      font-size: 12.5px;
      outline: none;
    }
    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 8px var(--accent-glow);
    }

    /* Spot Cards Mini List */
    .spot-mini-list {
      height: 180px;
      overflow-y: auto;
      background: rgba(0,0,0,0.15);
      border-bottom: 1px solid var(--border);
      padding: 6px 10px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      flex-shrink: 0;
    }
    .mini-card {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.14s ease;
    }
    .mini-card:hover {
      background: var(--bg-card-hover);
      border-color: rgba(255,255,255,0.22);
    }
    .mini-card.is-active {
      background: #1b352b;
      border-color: var(--accent);
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.3);
    }
    .mini-card-thumb {
      width: 36px;
      height: 24px;
      border-radius: 3px;
      object-fit: cover;
      background: #000;
      flex-shrink: 0;
    }
    .mini-card-name {
      font-size: 12px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }
    .mini-card-badge {
      font-size: 10.5px;
      color: #a7f3d0;
      font-weight: 600;
    }

    /* Spot Edit Form Pane */
    .form-pane {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      user-select: auto;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .form-label {
      font-size: 11.5px;
      font-weight: 700;
      color: #cbd5e1;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .form-control {
      background: rgba(0,0,0,0.35);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px 10px;
      color: #fff;
      font-size: 12.5px;
      outline: none;
      width: 100%;
    }
    .form-control:focus {
      border-color: var(--accent);
      box-shadow: 0 0 6px var(--accent-glow);
    }
    .form-row {
      display: flex;
      gap: 8px;
    }
    .form-row > * { flex: 1; }

    /* Smart Parser Banner */
    .smart-parser-box {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.12), rgba(5, 150, 105, 0.05));
      border: 1px solid rgba(16, 185, 129, 0.35);
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .smart-parser-title {
      font-size: 12px;
      font-weight: 700;
      color: #34d399;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Thumbnail Preview with live Street View trigger */
    .thumb-preview-box {
      position: relative;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
      height: 110px;
      background: #000;
    }
    .thumb-preview-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .thumb-preview-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      opacity: 0;
      transition: opacity 0.18s ease;
    }
    .thumb-preview-box:hover .thumb-preview-overlay {
      opacity: 1;
    }

    /* Live Preview Modal */
    .preview-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(10px);
      z-index: 99999;
      display: flex;
      flex-direction: column;
      display: none;
    }
    .preview-modal-header {
      padding: 12px 18px;
      background: #111a17;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .preview-modal-body {
      flex: 1;
      position: relative;
      background: #000;
    }
    .preview-modal-iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Auth Guard Modal */
    .auth-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      backdrop-filter: blur(14px);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      display: none;
    }
    .auth-card {
      background: #16221e;
      border: 1px solid rgba(16, 185, 129, 0.4);
      border-radius: 14px;
      padding: 24px 28px;
      width: 360px;
      max-width: 90vw;
      box-shadow: 0 20px 40px rgba(0,0,0,0.7);
      display: flex;
      flex-direction: column;
      gap: 16px;
      text-align: center;
    }

    /* Toast */
    .admin-toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(16, 185, 129, 0.95);
      color: #fff;
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 100000;
      pointer-events: none;
      opacity: 0;
    }
    .admin-toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- Top Action Header -->
  <header class="admin-header">
    <div class="admin-brand">
      <span class="admin-badge">PLAN CMS</span>
      <h1>復興國小 360° 平面圖定位管理後台</h1>
      <span class="stat-chip" id="spotCountChip">46 處景點</span>
    </div>
    <div class="admin-tools">
      <button class="btn btn-primary" id="btnCreateSpot">➕ 新增景點</button>
      <button class="btn" id="btnSaveLocal" title="保存所有修改至本地，前台 3D 校園立即生效">💾 本地生效</button>
      <button class="btn" id="btnExportJson" title="匯出 spots.json 檔案">📤 匯出 JSON</button>
      <button class="btn" id="btnCopyCode" title="複製可覆蓋 campus-ui.js 的陣列代碼">📋 複製代碼</button>
      <button class="btn" id="btnImportJson" title="從外部 JSON 檔案匯入">📥 匯入</button>
      <button class="btn btn-danger" id="btnResetDefault" title="還原官方 46 處景點預設值">🔄 原廠重置</button>
      <a href="./index.html" target="_blank" class="btn" title="在新分頁開啟 3D 校園前台">🌐 前往 3D 校園 ↗</a>
      <button class="btn" id="btnLockAuth">🔒 鎖定</button>
    </div>
  </header>

  <!-- Main Body: Map Stage (70%) + Sidebar (30%) -->
  <div class="admin-main">
    
    <!-- Left Map Stage (70%) -->
    <main class="plan-stage">
      
      <!-- Stage Toolbar -->
      <div class="plan-toolbar">
        <div class="floor-tabs">
          <button class="floor-btn" data-floor="ALL">全校總圖</button>
          <button class="floor-btn is-active" data-floor="1F">1F 一樓</button>
          <button class="floor-btn" data-floor="2F">2F 二樓</button>
          <button class="floor-btn" data-floor="3F">3F 三樓</button>
          <button class="floor-btn" data-floor="BF">BF 地下室</button>
        </div>

        <div class="stage-tip">
          <span>🖱️ 按住圖釘直接拖曳定位 · 點擊空白處瞬移圖釘 · 滾輪縮放地圖</span>
        </div>

        <div class="zoom-controls">
          <button class="zoom-btn" id="btnZoomOut" title="縮小">−</button>
          <span class="zoom-label" id="zoomLevelLabel">100%</span>
          <button class="zoom-btn" id="btnZoomIn" title="放大">+</button>
          <button class="btn" id="btnResetZoom" style="padding:3px 8px;font-size:11.5px;">⌂ 居中</button>
        </div>
      </div>

      <!-- Plan Viewport (Pan & Zoom) -->
      <div class="plan-viewport" id="planViewport">
        <div class="plan-transform-layer" id="planTransformLayer">
          <img id="planImg" class="plan-img" src="./assets/plans/1f.jpg" alt="學校平面圖">
          <div class="pins-layer" id="pinsLayer"></div>
        </div>
      </div>

      <!-- Floating Coordinate HUD -->
      <div class="stage-hud">
        <div class="hud-title" id="hudSpotTitle">#12 復興路正門口與通學步道 (1F)</div>
        <div class="hud-coords" id="hudCoordsText">
          平面像素: PX 920, PY 220 ➜ 自動換算 3D: X 106.08, Y 2.20, Z -5.20
        </div>
      </div>

    </main>

    <!-- Right Sidebar Form (30%) -->
    <aside class="admin-sidebar">
      
      <!-- Search & Mini List -->
      <div class="sidebar-header">
        <input type="text" class="search-input" id="searchSpotInput" placeholder="🔍 搜尋景點名稱、分類、序號...">
      </div>

      <div class="spot-mini-list" id="spotMiniList"></div>

      <!-- Spot Edit Form -->
      <div class="form-pane">
        
        <!-- Google Maps Smart Parser Banner -->
        <div class="smart-parser-box">
          <div class="smart-parser-title">
            <span>⚡ Google 街景分享網址一鍵智慧解析</span>
          </div>
          <input type="text" class="form-control" id="smartUrlInput" placeholder="在此貼上 Google Maps 360 分享網址 (https://maps.app.goo.gl/... 或 google.com/maps/...)">
          <button type="button" class="btn btn-primary" id="btnExecuteSmartParse" style="justify-content:center;">
            ⚡ 一鍵智慧解析並自動填入
          </button>
        </div>

        <!-- Basic Spot Info -->
        <div class="form-row">
          <div class="form-group" style="flex:0.8;">
            <label class="form-label">編號 (ID)</label>
            <input type="text" class="form-control" id="fId" readonly style="color:var(--text-muted);background:rgba(0,0,0,0.5);">
          </div>
          <div class="form-group" style="flex:0.6;">
            <label class="form-label">序號 (Num)</label>
            <input type="number" class="form-control" id="fNum">
          </div>
          <div class="form-group" style="flex:0.8;">
            <label class="form-label">樓層</label>
            <select class="form-control" id="fFloor">
              <option value="1F">1F</option>
              <option value="2F">2F</option>
              <option value="3F">3F</option>
              <option value="BF">BF</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">景點名稱 (Name)</label>
          <input type="text" class="form-control" id="fName" placeholder="例如：復興路正門口與通學步道">
        </div>

        <div class="form-group">
          <label class="form-label">區域分組 (Group)</label>
          <select class="form-control" id="fGroup">
            <option value="校門與戶外前庭">校門與戶外前庭</option>
            <option value="南棟仁愛樓">南棟仁愛樓</option>
            <option value="北棟信義樓">北棟信義樓</option>
            <option value="東棟和平樓">東棟和平樓</option>
            <option value="西棟忠孝樓">西棟忠孝樓</option>
            <option value="新大樓愛悅樓">新大樓愛悅樓</option>
            <option value="中庭與綠色花園">中庭與綠色花園</option>
            <option value="操場球場與遊戲區">操場球場與遊戲區</option>
            <option value="幼兒園與附設區">幼兒園與附設區</option>
          </select>
        </div>

        <!-- Coordinates Box -->
        <div class="form-group" style="background:rgba(0,0,0,0.25);border:1px solid var(--border);border-radius:8px;padding:8px 10px;">
          <label class="form-label">
            <span style="color:#a7f3d0;">地景定位坐標</span>
            <span style="font-size:10.5px;color:var(--text-muted);">左側平面圖拖曳自動計算</span>
          </label>
          <div class="form-row" style="margin-top:4px;">
            <div class="form-group">
              <label class="form-label" style="font-size:10.5px;">平面 PX</label>
              <input type="number" class="form-control" id="fPx" style="font-family:monospace;">
            </div>
            <div class="form-group">
              <label class="form-label" style="font-size:10.5px;">平面 PY</label>
              <input type="number" class="form-control" id="fPy" style="font-family:monospace;">
            </div>
            <div class="form-group">
              <label class="form-label" style="font-size:10.5px;">3D 高度 Y (m)</label>
              <input type="number" step="0.1" class="form-control" id="fY" style="font-family:monospace;">
            </div>
          </div>
          <div style="font-size:11px;color:#6ee7b7;font-family:monospace;margin-top:6px;" id="formCoordsCalcPreview">
            換算 3D: X 106.08, Z -5.20
          </div>
        </div>

        <!-- Thumbnail & Preview -->
        <div class="form-group">
          <label class="form-label">
            <span>縮圖與實景檢驗</span>
            <button type="button" class="btn" id="btnOpenLivePreview" style="padding:2px 8px;font-size:11px;">🔍 開啟實景預覽</button>
          </label>
          <div class="thumb-preview-box">
            <img id="fThumbPreview" class="thumb-preview-img" src="./assets/campus_overview_preview.jpg" alt="預覽縮圖">
            <div class="thumb-preview-overlay">
              <button type="button" class="btn btn-primary" id="btnOverlayPreview">🌐 測試 360 原生街景</button>
            </div>
          </div>
        </div>

        <!-- Media URLs -->
        <div class="form-group">
          <label class="form-label">縮圖網址 (Thumb URL)</label>
          <input type="url" class="form-control" id="fThumb" placeholder="https://...">
        </div>

        <div class="form-group">
          <label class="form-label">Google 街景嵌入網址 (Embed URL / 原生直載)</label>
          <input type="url" class="form-control" id="fEmbedUrl" placeholder="https://maps.google.com/maps?layer=c&...">
        </div>

        <div class="form-group">
          <label class="form-label">360 原色全景大圖 (Pano URL)</label>
          <input type="url" class="form-control" id="fPanoUrl" placeholder="https://...=w2048">
        </div>

        <div class="form-group">
          <label class="form-label">簡介描述 (Description)</label>
          <textarea class="form-control" id="fDesc" rows="2" placeholder="景點環境或歷史說明..."></textarea>
        </div>

        <!-- Form Actions -->
        <div class="form-row" style="margin-top:8px;">
          <button type="button" class="btn btn-primary" id="btnSaveSpotForm">💾 儲存景點變更</button>
          <button type="button" class="btn" id="btnCloneSpot">📋 複製景點</button>
          <button type="button" class="btn btn-danger" id="btnDeleteSpot">🗑️ 刪除景點</button>
        </div>

      </div>
    </aside>

  </div>

  <!-- Live Street View Preview Modal -->
  <div class="preview-modal-backdrop" id="previewModal">
    <div class="preview-modal-header">
      <h3 id="prevModalTitle" style="font-size:14px;color:#fff;">360 實景預覽</h3>
      <button class="btn" id="btnClosePreviewModal">✕ 關閉預覽</button>
    </div>
    <div class="preview-modal-body">
      <iframe id="prevModalIframe" class="preview-modal-iframe" src="" allowfullscreen loading="lazy" allow="accelerometer; gyroscope; magnetometer; fullscreen"></iframe>
    </div>
  </div>

  <!-- Auth Guard Modal -->
  <div class="auth-backdrop" id="adminAuthModal">
    <div class="auth-card">
      <div class="admin-badge" style="width:fit-content;margin:0 auto;">CMS AUTH GUARD</div>
      <h2 style="font-size:18px;font-weight:800;color:#fff;">復興國小 360 管理工作台</h2>
      <p style="font-size:12.5px;color:var(--text-muted);">
        請輸入管理員密碼以進入平面圖定位工作台：
      </p>
      <input type="password" class="form-control" id="authPasswordInput" placeholder="預設密碼: fuxing360" style="text-align:center;font-size:14px;letter-spacing:0.1em;">
      <button class="btn btn-primary" id="btnSubmitAuth" style="justify-content:center;padding:9px 0;font-size:14px;">
        🔓 解鎖進入後台
      </button>
      <div id="authErrorMsg" style="font-size:11.5px;color:#f87171;display:none;">密碼錯誤，請重新輸入！</div>
    </div>
  </div>

  <!-- Hidden File Input for JSON import -->
  <input type="file" id="jsonFileInput" accept=".json" style="display:none;">

  <!-- Toast -->
  <div class="admin-toast" id="adminToast">保存成功！</div>

  <!-- Scripts -->
  <script src="./campus-ui.js"></script>
  <script src="./admin.js"></script>
</body>
</html>
